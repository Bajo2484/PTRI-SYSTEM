
<div class="partner-layout"
     [class.sidebar-expanded]="isSidebarExpanded"
     [class.menu-open]="isMobileMenuOpen">

  <!-- SIDEBAR -->
  <aside class="sidebar">

    <div class="brand">
  <div class="brand-icon">
    <img src="/images/ptri-logo.jpg" alt="DOST-PTRI Logo">
  </div>
  <div class="brand-text">
    <h2>DOST–PTRI</h2>
    <p>Silk Supply System</p>
  </div>
</div>

    <!-- SIDEBAR HEADING -->
    <div class="sidebar-heading">
      <span class="menu-label">PARTNER PORTAL</span>

      <button class="expand-toggle"
              type="button"
              (click)="toggleSidebar()"
              title="Expand or collapse sidebar">
        {{ isSidebarExpanded ? '‹' : '›' }}
      </button>
    </div>

    <!-- NAVIGATION -->
    <nav class="sidebar-nav">

      <a class="menu-item"
         routerLink="/partner/dashboard"
         routerLinkActive="active"
         [routerLinkActiveOptions]="{ exact: true }"
         (click)="closeMobileMenu()">
        <span class="menu-icon">▦</span>
        <span class="menu-item-label">Dashboard</span>
      </a>

      <a class="menu-item"
         routerLink="/partner/orders"
         routerLinkActive="active"
         (click)="closeMobileMenu()">
        <span class="menu-icon">▤</span>
        <span class="menu-item-label">My Orders</span>
      </a>

      <a class="menu-item"
         routerLink="/partner/deliveries"
         routerLinkActive="active"
         (click)="closeMobileMenu()">
        <span class="menu-icon">⇄</span>
        <span class="menu-item-label">Deliveries</span>
      </a>

      <a class="menu-item"
         routerLink="/partner/messages"
         routerLinkActive="active"
         (click)="closeMobileMenu()">
        <span class="menu-icon">✉</span>
        <span class="menu-item-label">Messages</span>
      </a>

      <a class="menu-item"
         routerLink="/partner/profile"
         routerLinkActive="active"
         (click)="closeMobileMenu()">
        <span class="menu-icon">♙</span>
        <span class="menu-item-label">My Profile</span>
      </a>

    </nav>

    <!-- PARTNER PROFILE -->
    <div class="sidebar-bottom">
      <div class="sidebar-footer">
        <div class="partner-avatar">P</div>

        <div class="partner-info">
          <h4>Partner Account</h4>
          <p>PTRI Partner</p>
        </div>
      </div>
    </div>

  </aside>

  <!-- MOBILE OVERLAY -->
  <button class="sidebar-overlay"
          type="button"
          aria-label="Close sidebar"
          (click)="closeMobileMenu()">
  </button>

  <!-- MAIN AREA -->
  <div class="main-area">

    <!-- TOPBAR -->
    <header class="topbar">

      <div class="topbar-left">
        <button class="menu-toggle"
                type="button"
                (click)="toggleMobileMenu()"
                aria-label="Open navigation menu">
          ☰
        </button>

        <div class="topbar-title">
          <h1>Partner Portal</h1>
          <p>Silk Supply and Delivery Communication System</p>
        </div>
      </div>

      <div class="topbar-right">
        <button class="logout-button"
                type="button"
                (click)="logout()">
          <span class="logout-icon">↪</span>
          <span class="logout-label">Logout</span>
        </button>
      </div>

    </header>

    <!-- PAGE CONTENT -->
    <main class="page-content">
      <router-outlet></router-outlet>
    </main>

  </div>

</div>
