
<section class="messages-page">
  <div class="page-heading">
    <h2>Messages</h2>
    <p>Communicate with PTRI staff about your silk supply orders.</p>
  </div>

  <div class="messages-container">
    <aside class="conversation-list">
      <div class="conversation-header">
        <h3>Conversations</h3>
        <span class="conversation-count">0</span>
      </div>

      <div class="search-box">
        <span>⌕</span>
        <input
          type="text"
          placeholder="Search conversations"
          aria-label="Search conversations"
          disabled
        />
      </div>

      <div class="conversation-empty">
        <div class="empty-icon">✉</div>
        <h4>No conversations yet</h4>
        <p>Your conversations with PTRI staff will appear here.</p>
      </div>
    </aside>

    <section class="message-area">
      <div class="message-placeholder">
        <div class="message-icon">✉</div>
        <h3>Your Messages</h3>
        <p>
          Select a conversation to view messages and communicate with PTRI staff.
        </p>
      </div>
    </section>
  </div>
</section>
